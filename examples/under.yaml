name: nightly
'on':
  schedule:
    - cron: '17 3 * * *'

permissions:
  contents: read

jobs:
  summarise:
    runs-on: ubuntu-latest
    steps:
      - name: count the workflows
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh api repos/o/r/actions/workflows --jq .total_count
