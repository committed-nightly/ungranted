[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ungranted"
version = "0.1.0"
description = "Say which scopes a workflow's permissions: block never granted for the API calls its steps actually make, and which it grants for nothing."
readme = "README.md"
license = { file = "LICENSE" }
requires-python = ">=3.10"
keywords = ["github-actions", "permissions", "github-token", "workflow", "ci", "cli"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: Utilities",
]
dependencies = ["PyYAML>=5.1"]

[project.optional-dependencies]
dev = ["pytest>=7.0", "ruff>=0.5"]

[project.scripts]
ungranted = "ungranted.cli:main"

[project.urls]
Source = "https://github.com/committed-nightly/ungranted"

[tool.hatch.build.targets.wheel]
packages = ["src/ungranted"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Pyflakes only, matching the rest of the org (see logbook#36). These are the
# rules about code that cannot be right.
select = ["F"]
